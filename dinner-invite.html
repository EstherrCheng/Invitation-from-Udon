<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dinner, Sunday</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap');

  :root{
    --forest:#2B3A2E;
    --forest-deep:#1B241C;
    --paper:#F1ECDD;
    --paper-line:#D9CFB2;
    --gold:#BE9A46;
    --gold-soft:#D9C384;
    --rust:#8A3B24;
    --ink:#1E1B16;
    --ink-soft:#5B5346;
    --cream-text:#EFE7D4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    font-family:'Work Sans', sans-serif;
    color:var(--ink);
    background:var(--paper);
    min-height:100vh;
  }
  h1,h2,h3, .serif{font-family:'Fraunces', serif;}
  a{color:inherit;}

  /* ---------- POSTER PAGE ---------- */
  .poster{
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(190,154,70,0.10), transparent 55%),
      var(--forest);
    color:var(--cream-text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
  }
  .poster-card{
    max-width:520px;
    width:100%;
    text-align:center;
  }
  .medallion{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:0 auto 28px;
    background:var(--forest-deep);
    border:2px solid var(--gold);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .medallion img{
    width:118%;
    height:auto;
    object-fit:contain;
  }
  .eyebrow{
    font-size:13px;
    letter-spacing:0.14em;
    color:var(--gold-soft);
    margin-bottom:14px;
    font-weight:500;
  }
  .poster h1{
    font-size:56px;
    font-weight:450;
    line-height:1.05;
    margin:0 0 6px;
    letter-spacing:-0.01em;
  }
  .poster h1 em{
    font-style:italic;
    font-weight:400;
    color:var(--gold);
  }
  .divider{
    width:56px;
    height:1px;
    background:var(--gold);
    margin:26px auto 36px;
    opacity:0.7;
  }
  .info-list{
    display:grid;
    gap:24px;
    text-align:left;
    margin-bottom:40px;
  }
  .info-row{
    display:grid;
    grid-template-columns:96px 1fr;
    gap:16px;
    border-bottom:1px solid rgba(217,195,132,0.18);
    padding-bottom:20px;
  }
  .info-row:last-child{border-bottom:none;}
  .info-row .k{
    font-size:12.5px;
    letter-spacing:0.09em;
    color:var(--gold-soft);
    padding-top:5px;
    font-weight:600;
  }
  .info-row .v{
    font-size:19px;
    line-height:1.45;
    color:var(--cream-text);
    font-family:'Fraunces', serif;
    font-weight:450;
  }
  .info-row .v.emph{
    color:var(--gold);
    font-weight:500;
  }
  .info-row .v .tag{
    display:inline-block;
    font-size:12px;
    border:1px solid var(--gold);
    color:var(--gold-soft);
    padding:1px 8px;
    border-radius:20px;
    margin-left:6px;
    font-family:'Work Sans', sans-serif;
  }
  .rsvp-btn{
    display:inline-block;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--forest-deep);
    background:var(--gold);
    padding:15px 44px;
    border-radius:2px;
    text-decoration:none;
    border:none;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .rsvp-btn:hover{background:var(--gold-soft);}
  .rsvp-btn:active{transform:translateY(1px);}
  .poster-footer{
    margin-top:22px;
    font-size:12px;
    color:#8E8770;
    font-style:italic;
    font-family:'Fraunces', serif;
  }

  /* ---------- FORM PAGE ---------- */
  .form-page{
    min-height:100vh;
    padding:56px 20px 90px;
  }
  .form-wrap{
    max-width:600px;
    margin:0 auto;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color:var(--ink-soft);
    text-decoration:none;
    margin-bottom:28px;
  }
  .back-link:hover{color:var(--rust);}
  .form-header h1{
    font-size:38px;
    font-weight:450;
    margin:0 0 8px;
  }
  .form-header p{
    color:var(--ink-soft);
    font-size:15px;
    margin:0 0 40px;
  }
  .field{
    margin-bottom:34px;
  }
  .field-label{
    display:block;
    font-family:'Fraunces', serif;
    font-size:19px;
    font-weight:450;
    margin-bottom:14px;
  }
  .field-hint{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:-8px;
    margin-bottom:14px;
  }
  input[type="text"], textarea{
    width:100%;
    padding:11px 2px;
    border:none;
    border-bottom:1.5px solid var(--paper-line);
    background:transparent;
    font-family:'Work Sans', sans-serif;
    font-size:15px;
    color:var(--ink);
    resize:vertical;
  }
  input[type="text"]:focus, textarea:focus{
    outline:none;
    border-bottom-color:var(--rust);
  }
  ::placeholder{color:#B4A98D;}

  .choice-list{
    display:grid;
    gap:10px;
  }
  .choice{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:16px 18px;
    border:1.5px solid var(--paper-line);
    cursor:pointer;
    background:transparent;
    transition:border-color .15s ease, background .15s ease;
  }
  .choice:hover{border-color:var(--gold);}
  .choice.selected{
    border-color:var(--rust);
    background:rgba(138,59,36,0.05);
  }
  .choice-mark{
    width:18px;
    height:18px;
    border:1.5px solid var(--paper-line);
    flex-shrink:0;
    margin-top:2px;
    position:relative;
  }
  .choice.selected .choice-mark{border-color:var(--rust);}
  .choice.selected .choice-mark::after{
    content:'';
    position:absolute;
    top:3px; left:3px;
    width:8px; height:8px;
    background:var(--rust);
  }
  .choice input{
    position:absolute;
    opacity:0;
    width:0; height:0;
  }
  .choice-text .t{
    font-size:15.5px;
    font-weight:500;
  }
  .choice-text .s{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:3px;
  }
  .choice-text .t .spicy-tag{
    display:inline-block;
    font-size:11px;
    border:1px solid var(--rust);
    color:var(--rust);
    padding:1px 7px;
    border-radius:20px;
    margin-left:8px;
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    vertical-align:middle;
  }
  .ride-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  @media (max-width:480px){
    .ride-grid{grid-template-columns:1fr;}
    .poster h1{font-size:42px;}
    .form-header h1{font-size:30px;}
  }
  .error-msg{
    color:var(--rust);
    font-size:12.5px;
    margin-top:8px;
    display:none;
  }
  .submit-btn{
    width:100%;
    padding:17px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:15.5px;
    letter-spacing:0.02em;
    cursor:pointer;
    margin-top:6px;
    transition:background .15s ease;
  }
  .submit-btn:hover{background:var(--forest-deep);}
  .submit-btn:disabled{opacity:0.55; cursor:default;}

  /* ---------- SUCCESS ---------- */
  .success-page{
    min-height:100vh;
    background:var(--forest);
    color:var(--cream-text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    text-align:center;
  }
  .success-inner{max-width:420px;}
  .success-inner .medallion{margin-bottom:26px;}
  .success-inner h2{
    font-size:34px;
    font-weight:450;
    margin:0 0 10px;
  }
  .success-inner p{
    color:#C9C0A8;
    font-size:15px;
    line-height:1.6;
  }

  /* ---------- HOST VIEW ---------- */
  .host-page{
    min-height:100vh;
    padding:50px 20px 90px;
  }
  .host-wrap{max-width:920px; margin:0 auto;}
  .host-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:14px;
    margin-bottom:28px;
    border-bottom:1.5px solid var(--paper-line);
    padding-bottom:20px;
  }
  .host-header h1{font-size:32px; font-weight:450; margin:0;}
  .refresh-btn{
    padding:9px 18px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    cursor:pointer;
    font-size:13px;
  }
  .refresh-btn:hover{background:var(--ink); color:var(--paper);}
  table.results{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
  }
  table.results th{
    text-align:left;
    padding:10px 14px;
    font-family:'Fraunces', serif;
    font-weight:450;
    font-size:15px;
    border-bottom:1.5px solid var(--ink);
    white-space:nowrap;
  }
  table.results td{
    padding:12px 14px;
    border-bottom:1px solid var(--paper-line);
    vertical-align:top;
  }
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:17px;
  }
  .scroll-x{overflow-x:auto;}
</style>
</head>

const STORAGE_KEY_PREFIX = 'rsvp:';
const INDEX_KEY = 'rsvp-index';

const MENU_OPTIONS = [
  {id:'sichuan', title:'Sichuan Spicy Hotpot', tag:'spicy', sub:'Numbing, fiery, the classic mala experience'},
  {id:'hainan', title:'Hainan Zaopocu Hotpot', tag:null, sub:'Seafood-forward, tangy and light — not spicy'},
  {id:'daikon', title:'Daikon Beef Soup + Sichuan Egg Fried Rice', tag:'a little spicy', sub:'Cozy, home-style comfort food'}
];

function el(tag, attrs = {}, children = []){
  const e = document.createElement(tag);
  for(const k in attrs){
    if(k === 'class') e.className = attrs[k];
    else if(k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (Array.isArray(children) ? children : [children]).forEach(c=>{
    if(c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
}

function renderPoster(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const poster = el('div', {class:'poster'});
  const card = el('div', {class:'poster-card'});

  card.appendChild(el('div', {class:'medallion'}, el('img', {src:DOG1, alt:'The host, supervising'})));
  card.appendChild(el('div', {class:'eyebrow'}, 'AN INVITATION'));
  card.appendChild(el('h1', {}, ['You are ', el('em',{},'invited!')]));
  card.appendChild(el('div', {class:'divider'}));

  const infoList = el('div', {class:'info-list'});
  const rows = [
    ['When', 'Sunday, Sep 6 — 6:00 PM onward, until whenever', true],
    ['Where', '3105 District Ave, APT 419 — park anywhere near the pool', true],
    ['Note', 'My dog will be running the place', false],
    ['After', "Movie night, or the pool's open — bring a swimsuit if you're up for it", false]
  ];
  rows.forEach(([k,v,emph])=>{
    infoList.appendChild(el('div', {class:'info-row'}, [
      el('div', {class:'k'}, k),
      el('div', {class: emph ? 'v emph' : 'v'}, v)
    ]));
  });
  card.appendChild(infoList);

  const rsvpBtn = el('a', {class:'rsvp-btn', href:'#rsvp'}, 'RSVP');
  card.appendChild(rsvpBtn);

  poster.appendChild(card);
  app.appendChild(poster);
}

function renderForm(){
  const app = document.getElementById('app');
  app.innerHTML = '';

  const page = el('div', {class:'form-page'});
  const wrap = el('div', {class:'form-wrap'});

  wrap.appendChild(el('a', {class:'back-link', href:'#'}, '← Back to invitation'));

  wrap.appendChild(el('div', {class:'form-header'}, [
    el('h1', {}, 'RSVP'),
    el('p', {}, "A few quick questions so I know what to cook (and how you're getting here).")
  ]));

  // Name
  const nameField = el('div', {class:'field'});
  nameField.appendChild(el('label', {class:'field-label'}, "What's your name?"));
  const nameInput = el('input', {type:'text', placeholder:'Your name'});
  nameField.appendChild(nameInput);
  const nameErr = el('div', {class:'error-msg'}, 'Please enter your name.');
  nameField.appendChild(nameErr);
  wrap.appendChild(nameField);

  // Menu
  const menuField = el('div', {class:'field'});
  menuField.appendChild(el('label', {class:'field-label'}, 'Pick the menu'));
  menuField.appendChild(el('div', {class:'field-hint'}, "Whichever gets the most votes wins."));
  const menuList = el('div', {class:'choice-list'});
  let selectedMenu = null;
  MENU_OPTIONS.forEach(opt=>{
    const titleSpan = el('span', {class:'t'}, opt.title);
    if(opt.tag) titleSpan.appendChild(el('span', {class:'spicy-tag'}, opt.tag));
    const choice = el('label', {class:'choice'}, [
      el('div', {class:'choice-mark'}),
      el('input', {type:'radio', name:'menu', value:opt.id}),
      el('div', {class:'choice-text'}, [titleSpan, el('div', {class:'s'}, opt.sub)])
    ]);
    const radio = choice.querySelector('input');
    radio.addEventListener('change', ()=>{
      menuList.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
      choice.classList.add('selected');
      selectedMenu = opt.id;
    });
    menuList.appendChild(choice);
  });
  menuField.appendChild(menuList);
  const menuErr = el('div', {class:'error-msg'}, 'Please pick one menu option.');
  menuField.appendChild(menuErr);
  wrap.appendChild(menuField);

  // Allergies
  const allergyField = el('div', {class:'field'});
  allergyField.appendChild(el('label', {class:'field-label'}, "Anything you don't eat?"));
  const allergyInput = el('textarea', {rows:'2', placeholder:'Allergies, dislikes, vegetarian, etc. — or leave blank'});
  allergyField.appendChild(allergyInput);
  wrap.appendChild(allergyField);

  // Hotpot cravings
  const hotpotField = el('div', {class:'field'});
  hotpotField.appendChild(el('label', {class:'field-label'}, "If it's hotpot — any must-have ingredients?"));
  const hotpotInput = el('textarea', {rows:'2', placeholder:'e.g. fish balls, lamb slices, enoki mushrooms...'});
  hotpotField.appendChild(hotpotInput);
  wrap.appendChild(hotpotField);

  // Ride
  const rideField = el('div', {class:'field'});
  rideField.appendChild(el('label', {class:'field-label'}, 'Do you need a ride?'));
  const rideGrid = el('div', {class:'ride-grid'});
  const rideChoices = [
    {id:'here', label:'A ride there'},
    {id:'home', label:'A ride home'},
    {id:'both', label:'Both, please'},
    {id:'none', label:"I'm all set"}
  ];
  let selectedRide = null;
  rideChoices.forEach(rc=>{
    const choice = el('label', {class:'choice'}, [
      el('div', {class:'choice-mark'}),
      el('input', {type:'radio', name:'ride', value:rc.id}),
      el('div', {class:'choice-text'}, el('div', {class:'t'}, rc.label))
    ]);
    const radio = choice.querySelector('input');
    radio.addEventListener('change', ()=>{
      rideGrid.querySelectorAll('.choice').forEach(c=>c.classList.remove('selected'));
      choice.classList.add('selected');
      selectedRide = rc.id;
    });
    rideGrid.appendChild(choice);
  });
  rideField.appendChild(rideGrid);
  const rideErr = el('div', {class:'error-msg'}, 'Please pick an option.');
  rideField.appendChild(rideErr);
  wrap.appendChild(rideField);

  const submitBtn = el('button', {class:'submit-btn'}, 'Send RSVP');
  wrap.appendChild(submitBtn);

  submitBtn.addEventListener('click', async ()=>{
    let valid = true;
    nameErr.style.display = 'none';
    menuErr.style.display = 'none';
    rideErr.style.display = 'none';

    if(!nameInput.value.trim()){ nameErr.style.display = 'block'; valid = false; }
    if(!selectedMenu){ menuErr.style.display = 'block'; valid = false; }
    if(!selectedRide){ rideErr.style.display = 'block'; valid = false; }
    if(!valid) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const entry = {
      name: nameInput.value.trim(),
      menu: MENU_OPTIONS.find(o=>o.id===selectedMenu).title,
      allergies: allergyInput.value.trim() || '—',
      hotpotCravings: hotpotInput.value.trim() || '—',
      ride: rideChoices.find(r=>r.id===selectedRide).label,
      submittedAt: new Date().toISOString()
    };

    try{
      const entryId = 'entry_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      await window.storage.set(STORAGE_KEY_PREFIX + entryId, JSON.stringify(entry), true);

      let indexArr = [];
      try{
        const idxRes = await window.storage.get(INDEX_KEY, true);
        if(idxRes && idxRes.value) indexArr = JSON.parse(idxRes.value);
      }catch(e){ indexArr = []; }
      indexArr.push(entryId);
      await window.storage.set(INDEX_KEY, JSON.stringify(indexArr), true);

      renderSuccess();
    }catch(err){
      console.error('Storage error:', err);
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send RSVP';
      alert('Something went wrong saving your RSVP — please try again.');
    }
  });

  page.appendChild(wrap);
  app.appendChild(page);
}

function renderSuccess(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const page = el('div', {class:'success-page'});
  const inner = el('div', {class:'success-inner'});
  inner.appendChild(el('div', {class:'medallion'}, el('img', {src:DOG2, alt:'A very good dog'})));
  inner.appendChild(el('h2', {}, "You're on the list"));
  inner.appendChild(el('p', {}, "See you Sunday at six. Bring your appetite — and your swimsuit, if you're feeling it."));
  page.appendChild(inner);
  app.appendChild(page);
}

async function renderHostView(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  const page = el('div', {class:'host-page'});
  const wrap = el('div', {class:'host-wrap'});

  const header = el('div', {class:'host-header'}, [
    el('div', {}, [
      el('h1', {}, 'RSVP results'),
      el('a', {class:'back-link', href:'#', html:'← Back to invitation'})
    ])
  ]);
  const refreshBtn = el('button', {class:'refresh-btn'}, '↻ Refresh');
  header.appendChild(refreshBtn);
  wrap.appendChild(header);

  const tableContainer = el('div', {class:'scroll-x'});
  wrap.appendChild(tableContainer);
  page.appendChild(wrap);
  app.appendChild(page);

  async function loadAndRender(){
    tableContainer.innerHTML = '<div class="empty-state">Loading…</div>';
    let indexArr = [];
    try{
      const idxRes = await window.storage.get(INDEX_KEY, true);
      if(idxRes && idxRes.value) indexArr = JSON.parse(idxRes.value);
    }catch(e){ indexArr = []; }

    if(indexArr.length === 0){
      tableContainer.innerHTML = '<div class="empty-state">No RSVPs yet.</div>';
      return;
    }

    const entries = [];
    for(const id of indexArr){
      try{
        const res = await window.storage.get(STORAGE_KEY_PREFIX + id, true);
        if(res && res.value) entries.push(JSON.parse(res.value));
      }catch(e){ /* skip */ }
    }
    entries.sort((a,b)=> new Date(a.submittedAt) - new Date(b.submittedAt));

    const table = el('table', {class:'results'});
    table.appendChild(el('thead', {}, el('tr', {}, [
      el('th', {}, 'Name'),
      el('th', {}, 'Menu vote'),
      el('th', {}, "Won't eat"),
      el('th', {}, 'Hotpot cravings'),
      el('th', {}, 'Ride'),
      el('th', {}, 'Submitted')
    ])));
    const tbody = el('tbody');
    entries.forEach(e=>{
      const submitted = new Date(e.submittedAt);
      tbody.appendChild(el('tr', {}, [
        el('td', {}, e.name),
        el('td', {}, e.menu),
        el('td', {}, e.allergies),
        el('td', {}, e.hotpotCravings),
        el('td', {}, e.ride),
        el('td', {}, submitted.toLocaleString())
      ]));
    });
    table.appendChild(tbody);
    tableContainer.innerHTML = '';
    tableContainer.appendChild(table);
  }

  refreshBtn.addEventListener('click', loadAndRender);
  await loadAndRender();
}

function route(){
  const hash = window.location.hash;
  if(hash === '#host') renderHostView();
  else if(hash === '#rsvp') renderForm();
  else renderPoster();
}

window.addEventListener('hashchange', route);
route();
</script>
